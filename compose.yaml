services:
  backend-nonton-yuk:
    image: ghcr.io/ridhoarmand/backend-nonton-yuk:latest
    container_name: backend-nonton-yuk
    expose:
      - "8080"
    environment:
      NONTON_YUK_API_TOKEN: "${NONTON_YUK_API_TOKEN:?Set a random token in .env}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 80m
    cpus: 1.0
    healthcheck:
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
    networks:
      - proxy-tier

networks:
  proxy-tier:
    external: true
    name: proxy-tier
